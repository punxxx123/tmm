function psPull(force){const a=tgAcc();if(!srvOn()||!a||!a.tok||PSX.busy)return;if(!force&&Date.now()-PSX.t<6e5)return;PSX.busy=1;PSX.t=Date.now();
 try{api('GET','/api/stats',undefined,a.tok).then(r=>{PSX.busy=0;if(!r||r.st!==200||!r.b||!Array.isArray(r.b.items))return;PSX.k=r.b.keys||null;if(psApply(r.b.items)){save();render()}}).catch(()=>{PSX.busy=0})}catch(e){PSX.busy=0}}
function psSum(arr,k){const v=arr.filter(Boolean);if(!v.length)return null;const o={v:0};for(const x of v){if(x.v!=null)o.v+=x.v;for(const f of ['l','c','r'])if(x[f]!=null)o[f]=(o[f]||0)+x[f]}return o}
function psApply(items){let ch=false;const by={};items.forEach(it=>{(by[it.key]=by[it.key]||[]).push(it)});
 for(const p of S.p||[])for(const t of p.tasks||[]){const L=by[p.id+':'+t.id];if(!L)continue;
  const ps={};L.forEach(it=>{ps[it.url]={pl:it.platform,h1:it.h1&&it.h1.v!=null?it.h1:null,d1:it.d1&&it.d1.v!=null?it.d1:null,d3:it.d3&&it.d3.v!=null?it.d3:null,d7:it.d7&&it.d7.v!=null?it.d7:null,er:it.error||null,w:it.wait?1:0}});
  const pick=k=>psSum(Object.values(ps).map(x=>x[k])),m3=pick('d3'),m7=pick('d7');
  const nm=m3?Object.assign({},m3,{auto:1}):null,old=JSON.stringify([t.ps||null,t.m||null,t.m7||null]);
  t.ps=ps;if(nm&&(!t.m||t.m.auto))t.m=nm;else if(!nm&&t.m&&t.m.auto)delete t.m;if(m7&&(!t.m7||t.m7.auto))t.m7=Object.assign({},m7,{auto:1});
  if(JSON.stringify([t.ps,t.m||null,t.m7||null])!==old)ch=true}
 return ch}

const VFN={hookt:'🧪 тест хука',teaser:'🎬 тизер',snip:'🎬 сниппет',lip:'🎬 липсинк',dance:'🎬 танец/тренд',live:'🎬 живое исполнение',edits:'🎬 эдиты',cover:"🎬 кавер",react:"🎬 реакция близких",reply:"🎬 видео-ответ",duet:"🎬 дуэт/ремикс",stems:"🎬 разбор по дорожкам",carou:"🖼 фотодамп",circle:"⭕ кружок",viz:"🎬 визуализатор",lyric:'🎬 лирик-видео',sms:'🎬 СМС-видео',mood:'🎬 mood-ролик',vert:'🎬 ролик после выхода',back:'🎬 бэкстейдж',trans:'🎬 переход на слове',pov:'🎬 POV: мой город',fail:'🎬 сорвалось → получилось'},VFT={edits:'Эдиты',cover:"Кавер в своём стиле",react:"Реакция близких на трек",reply:"Видео-ответ на комментарий",duet:"Дуэт или ремикс с подписчиком",stems:"Разбор трека по дорожкам",carou:"Фотодамп: как шла работа над треком",circle:"Кружок в Telegram",viz:"Визуализатор трека на YouTube",live:'Живое исполнение: отрывок вживую',teaser:'Тизер 1: разогрев аудитории',snip:'Сниппет: фрагмент трека',lip:'Липсинк под трек',dance:'Танец или тренд под трек',lyric:'Лирик-видео (фан-аккаунт)',sms:'СМС-видео до релиза (неосновной аккаунт)',mood:'Mood-ролик: вызвать эмоцию',vert:'Ролик после выхода',back:'Бэкстейдж: процесс',trans:'Переход на слове',pov:'POV: музыка из моего города',fail:'Сорвалось → получилось'},VFH={"edits":"Что такое эдиты: короткие нарезки фан-сообществ — машины, футбол, аниме, игры, кино, — где кадры смонтированы точно в такт музыки. Монтажёры постоянно ищут для них новые ритмичные звуки.\nЗачем: если монтажёры возьмут твой трек, он разойдётся по чужим аккаунтам и попадёт к людям, которые на тебя не подписаны. Твой ролик — образец, который показывает, как звук ложится на монтаж.\nВ кадре: 6–10 своих коротких кадров из одной ниши, смена кадра точно в бочку и снейр.\nЗвук: самый ритмичный кусок трека, 10–15 секунд, с дропом в середине.\nПодпись: на дропе крупный текст «Звук свободен для эдитов — лучшие отмечу».","cover":"Цель: попасть к чужой аудитории — люди ищут знакомую песню и находят тебя.\nВ кадре: ты исполняешь кусок популярного трека в своём стиле: под гитару, свой бит или акапелла.\nЗвук: 20–40 секунд кавера. В подписи укажи автора оригинала.\nПодпись: «Мой вариант. Скоро выйдет мой трек — следи за страницей».","react":"Цель: вызвать эмоцию и доверие через живую реакцию.\nВ кадре: близкий человек впервые слушает трек в наушниках, снимай лицо крупно. Не подсказывай, как реагировать.\nЗвук: фрагмент трека, который он слышит, 15–30 секунд.\nПодпись: кто это и что он сказал после.","reply":"Цель: показать, что ты видишь слушателей, и продолжить обсуждение.\nВ кадре: выбери интересный комментарий под своим видео и ответь на него коротким роликом. В TikTok, Reels и YouTube Shorts есть кнопка ответа видео на комментарий.\nЗвук: твой голос, трек тихо фоном.\nПодпись: одна фраза от себя.","duet":"Цель: дать треку разойтись через чужие видео.\nВ кадре: сделай дуэт с видео подписчика под твой трек (TikTok — «Дуэт», Reels и YouTube Shorts — «Ремикс») или предложи снять свою версию и выложи лучшую.\nЗвук: тот же фрагмент трека, что у подписчика.\nПодпись: отметь автора и поблагодари.","stems":"Цель: показать, как сделан трек, — это цепляет и музыкантов, и слушателей.\nВ кадре: экран проекта или ты у компьютера, включай дорожки по одной.\nЗвук: по 3–4 секунды на слой: бит → бас → вокал → финальная версия.\nПодпись: «Какой слой лучший?»","carou":"Цель: показать живую сторону работы над треком.\nФото: 5–10 кадров за время работы: студия, черновики, еда, друзья, дорога. Без постановки.\nПодпись под фото: 2–3 строки о том, каким был этот месяц. Последней строкой задай вопрос подписчикам.\nФормат: карусель в Instagram, несколько фото в одном посте ВК.\nТрек: название и звук пока не показывай.","circle":"Цель: самый тёплый контакт с теми, кто подписан на канал.\nВ кадре: ты, круглое видео до минуты прямо из Telegram — расскажи, что сейчас происходит с треком, как другу.\nЗвук: твой голос, без музыки.\nГде: только твой Telegram-канал.","viz":"Цель: чтобы трек целиком был на YouTube — там его ищут и слушают фоном.\nВ кадре: обложка трека с лёгкой анимацией (пульсация, зерно, медленный зум) на весь трек.\nЗвук: полный трек.\nКак сделать: в бесплатном видеоредакторе за 15 минут, в описании — ссылки на площадки.","live":"Цель: показать, что ты звучишь вживую — это вызывает больше доверия, чем липсинк.\nВ кадре: ты играешь на инструменте и поёшь отрывок. Одна точка съёмки: репетиция, комната или улица.\nЗвук: живой звук с телефона или петлички, 20–40 секунд припева или риффа.","teaser": "Цель: разогреть аудиторию — показать, что скоро что-то будет, но не что именно.\nВ кадре: загадочная деталь — предмет, свет, силуэт. Без слов о релизе и без даты.\nЗвук: тишина, шум места или приглушённый кусочек на 1–2 секунды. Сам трек не показываем.", "snip": "Цель: познакомить с треком до релиза и вызвать желание сохранить пресейв.\nВ кадре: ты крупно поёшь под фрагмент или один красивый кадр под музыку. Один герой, одна локация.\nЗвук: 10–30 секунд самого цепкого куска нового трека — припев или хук.\nПодпись: дата выхода и «пресейв в шапке».", "lip": "Цель: показать трек через тебя — лицо и эмоцию.\nВ кадре: ты крупно, свет на лицо, поёшь точно в слова. Хук в первые 2 секунды.\nЗвук: самый цепкий куплет или припев трека, 10–20 секунд.", "dance": "Цель: дать людям повторить движение — так трек расходится.\nВ кадре: одно простое движение, которое описывается одной фразой, получается с первого дубля, без реквизита, в одиночку и понятно без звука. Проверь на двух знакомых: если повторили одинаково — работает.\nЗвук: кусок трека, под который удобно двигаться, 10–20 секунд.", "lyric": "Цель: дать треку картинку без съёмок.\nВ кадре: текст песни крупными субтитрами на фоне по настроению трека. Артист в кадре не нужен.\nЗвук: фрагмент трека, совпадающий с текстом на экране.\nГде: только TikTok, неосновной или фан-аккаунт.", "sms": "Цель: охват и пересылка. Люди отправляют такие ролики друзьям — так твой звук слышат тысячи тех, кто тебя не знает. Прямых прослушиваний будет немного, и это нормально.\nСерия: 5–7 роликов за неделю перед релизом, только TikTok, неосновной аккаунт. Хиты редкие — в сотни тысяч уходит редкий ролик, поэтому нужна именно серия.\nВ кадре: дворы, пятиэтажки, фонари, ночная улица — сними всё в один заход. По центру одна короткая фраза, которую хочется переслать или отметить в ней человека.\nЗвук: самый взрывной кусок трека — победитель теста хука. Спокойный атмосферный фон никто не заметит, на трек обращают внимание только когда цепляет сам звук.\nФразы: «можешь задать мне три вопроса, врать не буду», «прости, я не буду кидать тебе тиктоки, и вообще нам надо перестать общаться», «зачем любоваться звёздами, если у меня есть ты». Больше — в инструкции.\nПотом: на каждый «что за трек?» отвечай названием и закрепи комментарий «трек — название, полная версия в профиле». Смотри не на просмотры, а на такие вопросы и на ролики людей под твой звук. Засчитай по ссылке на лучший ролик.", "mood": "Цель: вызвать эмоцию, а не рассказать сюжет.\nВ кадре: свет, фактура, ты без слов — зритель должен почувствовать настроение трека. Из одной съёмки выйдет несколько роликов.\nЗвук: атмосферный кусок трека, 15–30 секунд.", "vert": "Отличие от сниппета: сниппет выходит до релиза, когда трек ещё нельзя послушать, — его задача, чтобы кусок запомнился и люди сделали пресейв. Этот ролик — после выхода: трек прикреплён официальным звуком, из ролика можно сразу перейти и сохранить его.\nЦель: держать внимание в первые дни после выхода, пока трек набирает прослушивания.\nСерия: если какой-то ролик до релиза зашёл лучше остальных, повтори его подачу — рост обычно даёт один формат, повторённый много раз.\nВ кадре: ты слушаешь трек в наушниках и одними губами подпеваешь любимую строчку. Можно собрать из уже снятого материала.\nЗвук: фрагмент вышедшего трека.\nПодпись: строчка из трека, которая цепляет сильнее всего, или вопрос «Под что вы бы это включили?».", "back": "Цель: показать изнанку, которую больше нигде не увидишь.\nВ кадре: как ты готовишься, что происходит между дублями, студия или репетиция.\nЗвук: живой звук со съёмки или твой голос. Трек не нужен."};

function img(f,m,cb,qq){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const q=Math.min(i.width,i.height),o=Math.min(m,q),c=document.createElement('canvas');c.width=c.height=o;c.getContext('2d').drawImage(i,(i.width-q)/2,(i.height-q)/2,q,q,0,0,o,o);cb(c.toDataURL('image/jpeg',qq||.82))};i.onerror=()=>alert('Не удалось открыть фото');i.src=r.result};r.readAsDataURL(f)}

function tdMsg(p){const t=today(),nx=p.tasks.filter(x=>!x.done&&x.date>t).map(x=>x.date).sort()[0],dn=p.tasks.some(x=>x.done&&x.dd===t);if(dn||!nx)return 'На сегодня всё сделано! Отдыхай — или загляни в «Задачи», что дальше 🎧';const d=nice(nx).replace(/ \d{4}$/,'');return p.tasks.some(x=>x.done)?'Сегодня задач нет, следующие — '+d+(/\.$/.test(d)?'':'.')+' Отдыхай или загляни в «Задачи», что дальше 🎧':'План стартует '+d+' — тогда здесь появятся первые задачи. Весь план по дням уже лежит в «Задачах» 🎧'}

const GD={hookchk:{t:"Как сейчас распространяется музыка",s:["Трек находят не целиком, а как 15 секунд в чужом ролике. Человек решает за 2 секунды: листать дальше или остаться.","Поэтому хук нужен не только в припеве: в эпоху коротких видео каждая часть трека — потенциальный звук для пересъёма. Проходной куплет пролистают.","Пересъём — это когда люди снимают свой ролик под твой звук. Так трек сам доходит до незнакомцев: каждый ролик — бесплатная реклама.","Проверь трек на 3 людях не из музыки: включи с середины и спроси, что запомнилось. Что повторяют вслух — то и хук.","Найденные куски пригодятся дальше: «Выбери кусок для сниппетов», тест хука, сторис и релизное видео."],tip:"Хит не гарантирует ничто, но трек без цепкого куска не вытянет ни одна стратегия продвижения. Большому проекту нужен хит — пиши под пересъёмы с первой строчки."},st_cover:{t:"Сторис с анимированной обложкой",s:["Фон — анимированная обложка 9:16 на 10–15 секунд, без звука в самом файле.","ВК: в редакторе истории нажми значок ноты «Музыка», найди свой трек и выбери 15 секунд припева. Стикер можно растянуть и поставить под обложку.","Нажав на стикер, зритель слушает трек целиком и может добавить его к себе. В статистике истории видно, сколько людей нажали и добавили.","Трека нет в поиске стикера: открой трек в VK Музыке → «Поделиться» → «В историю». Если и так не выходит — трек не открыт для историй, спроси дистрибьютора.","Instagram: стикер «Музыка», если трек есть в библиотеке, иначе стикер «Ссылка» на смарт-ссылку.","Текст: «Новый трек уже вышел» + название. Один призыв: «Нажми на трек и добавь к себе»."],tip:"Сделай 2–3 такие сторис за день с разными кусками трека: утром, днём и вечером. Сторис живут 24 часа — потом сохрани лучшую в «Актуальное»."},
anim_cover:{t:"Как сделать анимированную обложку",s:["Открой CapCut или Canva, создай вертикальный проект 1080×1920 (9:16).","Вставь обложку по центру. Фон: та же обложка, растянутая и размытая, или однотонный цвет из обложки.","Добавь одно движение: медленное приближение (зум 100→110%), мерцание света, пыль или частицы. Одного эффекта достаточно.","Длина 10–15 секунд. Проверь, что конец плавно переходит в начало — сторис будет крутиться по кругу.","Экспорт MP4, без звука. Сохрани в галерею телефона, чтобы в день релиза не искать."],tip:"Сверху и снизу сторис кнопки и подписи — важное держи в центральной части кадра."},

videoshot:{t:"Видеошот для Яндекс Музыки",s:["Что это: короткое зацикленное видео, которое играет за треком в плеере Яндекс Музыки.","Формат: вертикальное MP4 (H.264), 404×720 или больше, до 15 секунд.","В кадре: атмосфера трека — свет, место, детали, бэкстейдж. Пение не снимай: при зацикливании губы разойдутся со звуком.","Важное держи в центре, текст не ставь в нижнюю треть — там интерфейс.","Отправь файл дистрибьютору: напрямую артист загрузить не может. Спроси, принимает ли он видеошоты."],tip:"В VK Музыке видеошотов пока нет, только в Яндекс Музыке."},
snippick:{t:"Как выбрать кусок для сниппетов",s:["Найди 5–10 человек, которые ещё не слышали трек: друзья, коллеги, знакомые знакомых. Лучше те, кто слушает твой жанр.","Включи трек целиком, без вступительных объяснений, и смотри на человека, а не в телефон.","Отметь, где он начал качать головой, подпевать, улыбаться или переспрашивать.","После прослушивания спроси: «На каком моменте ты подумал(а): вот это круто?» и «Что запомнилось?»","Выпиши тайм-коды. Кусок, который назвали чаще всего, режь на сниппеты на 10–30 секунд: в TikTok, Reels и Shorts короче удерживает лучше.","Не бери вступление: в коротком видео нет времени на разгон. Сильнее всего работают припев, хук, дроп или ключевая строчка."],tip:"Трек никуда не выкладываем: это закрытое прослушивание. Публично звук показываем только за неделю до релиза."},
upload:{t:"Отгрузка релиза дистрибьютору",s:["Проверь трек: мастер в WAV 24 бит, громкость около −14 LUFS, есть ISRC-код (обычно выдаёт дистрибьютор), указаны авторы и доли прав, отмечен Explicit, если есть мат, загружен текст песни.","Загрузи мастер и обложку 3000×3000 px: JPG или PNG, без ссылок, цен и логотипов площадок.","Поставь дату релиза минимум через 3–4 недели, чтобы успеть пресейв и питчинг.","Заполни жанр, язык и настроение: по ним работают редакции и алгоритмы.","Проверь имя артиста посимвольно, как в профиле на площадках: из-за одной буквы трек уйдёт в чужую карточку или появится клон профиля.","Если есть фит, укажи второго артиста отдельно, а не в названии трека.","Дождись модерации и получи UPC: он нужен для пресейва."],tip:"Вернули с модерации — исправь замечания в тот же день: каждый день задержки съедает время на питчинг."},
pitch2:{t:"Пользовательские плейлисты и паблики",s:["Найди 5–10 пользовательских плейлистов в Яндекс Музыке и VK Музыке с треками твоего жанра и активными обновлениями.","Найди тематические Telegram-каналы о новой музыке и паблики ВК под твой жанр и город.","Найди контакт куратора: описание плейлиста, профиль, сообщения паблика.","Напиши коротко и лично: кто ты, о чём трек, жанр и настроение, ссылка на пресейв или закрытая ссылка на трек целиком (если просят фрагмент — 45–90 секунд с припевом), пресс-кит.","Попроси добавить трек в день выхода и предложи что-то взамен: упоминание в сторис или своём посте.","Запиши, кому отправил(а), и поблагодари тех, кто добавил."],tip:"Не плати за «гарантированное» попадание в плейлисты: там часто боты, и площадки могут за это наказать."},
d7:{t:"Итоги через 7 дней",s:["Открой статистику в кабинете дистрибьютора и кабинетах артиста на площадках.","Запиши: прослушивания, сохранения, новые слушатели, лучшие видео и посты.","Посчитай долю сохранений: сохранения ÷ прослушивания × 100. Ориентир: от 5–10% — хорошо, ниже 3% — трек не зацепил. Дослушивания от 60% — хорошо, ниже 50% — проблема в первых 30 секундах.","Посмотри источники: если почти всё — поиск по имени и твои ссылки, алгоритмы трек ещё не подхватили. Если есть «Моя волна», VK Микс, рекомендации — подхватили.","Найди, где оборвалось: не увидели (мало охвата) → не открыли (обложка, название, первый кадр) → не дослушали (начало трека) → не сохранили (трек не цепляет) → не вернулись (нечего слушать дальше).","Что сработало лучше всего? Повтори это в следующем релизе. Отдельно посмотри, какая рубрика или формат дали больше охвата и подписок, — сделай из неё серию.","Что не сработало? Одну вещь поменяй.","Открой релизную сетку: следующий релиз через месяц — идеальный темп. Запусти его план.","Раз в квартал обнови пресс-кит в профиле."],tip:"Маленькие цифры на старте — это нормально. Сравнивай себя с собой, а не с чужими цифрами: выводы видны по 3–4 релизам подряд."},
pitch:{t:"Питчинг трека самому: пошагово",s:["Заведи релиз у дистрибьютора заранее: минимум за 2 недели до даты, лучше за 3–4.","Честно заполни метаданные: жанр, настроение, язык, авторов — по ним редакции фильтруют заявки.","Если это EP или альбом, выбери один главный трек: обычно подают один-два трека.","Spotify: в Spotify for Artists открой раздел с предстоящими релизами и отправь заявку на неизданный трек, не позже чем за 7 дней до выхода.","Apple Music: сам подать заявку нельзя — питчинг только через дистрибьютора или лейбл, не позже чем за 10 дней до выхода. Спроси у дистрибьютора, есть ли такая опция.","Яндекс Музыка: заявка через личный кабинет BandLink с подтверждённым профилем артиста: «Аналитика» → «Яндекс Музыка» → «Будущий релиз» → «Отправить на питчинг». Кнопка появляется через 2–4 дня после того, как дистрибьютор подтвердит релиз. Отдельной заявки в «Нитро» нет: это механика Яндекса для артистов примерно до 5 000 слушателей в месяц, трек попадает туда через этот же питчинг и реакцию первых слушателей.","VK Музыка: заполни анкету нового релиза (vk.cc/new_release), понадобится UPC от дистрибьютора. Подавай не позже чем за 14 дней до выхода.","Звук: заявка через приложение Звук STUDIO, когда профиль артиста подтверждён, а дистрибьютор доставил трек. Можно до релиза или в течение 2 недель после, но чем раньше, тем лучше.","KION Музыка: открытая форма питчинга, не позже чем за 7 дней до выхода.","Напиши питч на 3–5 предложений, до 1000 знаков: кто ты, о чём трек, жанр и настроение, чем он интересен (история, фит, цифры) и как ты его продвигаешь (соцсети, контент-план). Без штампов вроде «уникальный стиль» — только конкретика.","Собери открытую облачную папку: мастер, обложка, текст песни, 3–4 промо-фото, пресс-релиз. Проверь, что доступ открыт по ссылке.","Приложи обложку, ссылку на предпрослушивание и свои соцсети.","Запиши, куда и когда подал заявку, и не подавай повторно один и тот же трек."],tip:"Гарантий попадания в плейлисты нет, но заявка с историей и планом продвижения сильнее пустой. Названия разделов в кабинетах меняются, поэтому сверяйся с правилами своей площадки и дистрибьютора."},
strategy:{t:"Как составить стратегию",s:["Выбери главную площадку и одну-две дополнительные.","Запиши смысл трека в 3 фразах: о чём он и что человек должен почувствовать.","Реши, как часто готов публиковаться, и не бери больше, чем потянешь.","Выбери прогрев: простой (сниппеты и интерактивы) или с историей вокруг трека."],tip:"Лучше скромный план, который выполнишь, чем огромный, который бросишь."},
plan:{t:"Как проверить план",s:["Пролистай задачи по этапам.","Убери то, что точно не успеешь, свайпом влево.","Добавь своё кнопкой «Добавить свою задачу».","Проверь, что даты не совпадают с твоими делами."]},
shoot:{t:"Как снять 5–10 сниппетов за один день",s:["Выбери 1–2 локации рядом друг с другом.","Подготовь 2–3 образа, чтобы ролики не были однотипными.","Выбери формат под концепцию: 9:16 или горизонтальный: в Reels и Shorts заходят оба, а для VK Клипов снимай только вертикально. По 15–30 секунд на идею, с запасом дублей.","Включай кусочки трека, под которые будешь монтировать.","Сними несколько кадров за кадром: как снимаешь и готовишься."],tip:"Один съёмочный день заменяет недели ежедневных съёмок."},
edit:{t:"Как смонтировать сниппеты",s:["Нарежь лучшие кадры.","Поставь самый цепкий момент трека в первые 2 секунды.","Добавь субтитры: многие смотрят без звука.","Держи текст и важное в центре кадра: верх и низ закрывает интерфейс площадки.","Не выкладывай ролик с водяным знаком TikTok в Reels, Shorts и ВК: такие видео показывают хуже. Сохраняй исходник без логотипа.","Экспортируй в выбранном формате (9:16 или горизонтальном; для VK Клипов только 9:16) и сохрани в отдельную папку с датами публикации."]},
design:{t:"Как оформить площадки",s:["Подготовь обложку трека и квадратную версию для аватара.","Обнови аватар и шапку на всех выбранных площадках в одном стиле.","Выбери 1–2 цвета и шрифт для постов.","Проверь, как всё выглядит на телефоне."],tip:"Бесплатных конструкторов с шаблонами достаточно."},
final:{t:"Финальная проверка",s:["Ссылка на трек лежит в шапке профиля, в ВК трек готов к прикреплению к посту.","Тексты релизных постов готовы под каждую площадку.","Отложенные посты поставлены, где это возможно.","Видео смонтированы, обложка загружена.","Карточка артиста на площадках заполнена: фото, описание, ссылки на соцсети. В ВК Студии карточка привязана к сообществу. Слушатель из рекомендаций сначала заходит туда.","Найди себя в поиске каждой площадки: нет ли второй карточки с твоим именем. Если есть — пиши дистрибьютору до выхода.","Привязка карточки ВК к сообществу (ВК Студия → «Карточка музыканта»): ты владелец сообщества, а не админ; включена двухфакторная защита; название совпадает с псевдонимом; в описании и закрепе нет ссылок на другие стриминги; сообщество живое."]},
night:{t:"Релизный пост в паблике ВК: пошагово",s:["Опубликуй в сообществе (паблике) ВК ровно в момент выхода трека, обычно 00:00 в ночь с четверга на пятницу.","Текст простой и короткий, без эмодзи: на такой пост потом можно настроить таргет, а с эмодзи он может не пройти модерацию. Пример: «Премьера! Артист — Название».","Прикрепи трек к посту (аудиозапись из VK Музыки), чтобы его можно было включить прямо из ленты, и добавь обложку. Внешних ссылок в тексте не ставь: ВК показывает такие посты меньше.","Не пиши много, чтобы пост был виден целиком, без «Показать полностью».","Закрепи пост в сообществе.","Обнови оформление паблика: аватар, мобильную и десктопную шапку под релиз.","Остальное, что идёт в других соцсетях, это побочные публикации в формате релизного поста."],tip:"Релизный пост в паблике ВК обязателен, даже если ты продвигаешься в других соцсетях."},
others:{t:"Побочные публикации в формате релизного поста",s:["Публикуй в день релиза с утра, до 10–11 часов: свежий контент получает максимальный охват.","Не копируй текст из ВК: сделай уникальный под каждую площадку, например в Instagram публикация или сторис, в Telegram пост в канале, в Одноклассниках тема в группе.","Ссылка на трек лежит в шапке профиля."]},
video:{t:"Как сделать видео",s:["Покажи самое цепкое в первые 2 секунды.","Формат на выбор: 9:16 или горизонтальный, как подходит концепции (для VK Клипов только 9:16). 15–30 секунд, звук трека.","Добавь субтитры.","Подпись короткая, с призывом послушать или ответить.","Если площадок несколько, выложи то же видео везде (кросспостинг) и вставь все ссылки."]},
post:{t:"Как сделать пост",s:["Одна мысль и одно фото или обложка.","Подпись простым языком.","В конце вопрос или призыв."]},
poll:{t:"Как сделать опрос",s:["Придумай простой вопрос про трек.","Дай 2–3 варианта.","Покажи итоги потом отдельным постом или сторис."]},
inter:{t:"Как сделать интерактив",s:["Попроси ответить эмодзи, словом или цифрой.","Отвечай на первые комментарии быстро.","Поблагодари самых активных."]},
story:{t:"Как сделать сторис",s:["3–5 кадров без сложного монтажа.","Добавь стикер опроса или вопроса.","Одна сторис — одна ссылка и одно действие: послушать, сохранить или прийти. Несколько ссылок сразу почти обнуляют переходы.","Призыв к действию — не чаще одной сторис из пяти, остальные — процесс, ответы, жизнь.","Если был плейлист или фит, отметь площадку или человека."]},
comm:{t:"Комьюнити на 10 минут",s:["Ответь на новые комментарии — на смысл, а не шаблоном.","Лайкни посты слушателей про твой трек.","Репостни сторис, где тебя отметили.","Веди список повторяющихся вопросов: если вопрос пришёл в пятый раз — сделай по нему отдельный пост."],tip:"Оскорбления и спам удаляй, а критику по делу оставляй: удаление выглядит хуже самой критики."},
ps_one:{t:"Как сделать пресейв",s:["Релиз должен быть загружен у дистрибьютора, лучше за 3–4 недели до даты. UPC обычно приходит за 1–4 дня после отгрузки, у некоторых дистрибьюторов — только после модерации. Поэтому задача стоит примерно через неделю после отгрузки.","Зайди в BandLink с подтверждённым профилем артиста: когда релиз доставят в Яндекс Музыку, пресейв создастся автоматически — останется его настроить.","Если пресейва нет или нужны другие площадки, получи у дистрибьютора UPC-код и вставь его в BandLink: «Создать» → «Релиз» → пресейвы → выбери площадки, где есть релиз.","Получи ссылку на пресейв.","Положи ссылку в шапку профиля во всех соцсетях и в закреп.","Открой ссылку с телефона и проверь, что сохранение работает."],tip:"Spotify в России официально недоступен, добавляй его, только если у тебя есть аудитория за границей. Условия сервисов меняются, сверяйся с актуальной инструкцией."},
ps_promo:{t:"Как продвигать пресейв",s:["Ссылка должна быть везде: био, закреп, сторис, Telegram-канал.","Одна простая мысль: «нажми кнопку, и трек сам окажется в библиотеке в день выхода».","Людям нужно увидеть призыв несколько раз, поэтому в плане его 5–7 повторений.","В день выхода эта же ссылка сама становится ссылкой на трек: менять её не нужно.","Дай повод: пресейв — ключ к закрытому чату или каналу с черновиками и закулисьем. Каждый материал внутри привязан к треку. Подарок не раскрывай заранее. Без денег, а пресейвов заметно больше.","Не покупай и не накручивай пресейвы: они не приводят слушателей."],tip:"Ориентир: пресейв делают 3–7% тех, кто увидел анонс; при аудитории до 500 подписчиков 10–30 пресейвов — нормальный результат. Пресейв работает, только если люди включают трек в первый день."},
vf_hookt:{t:"Как провести тест хука",s:["Сними одну простую сцену 3 раза подряд — меняться будет только звук.","Поставь в каждый ролик свой кусок трека на 10–15 секунд: припев, куплет, инструментальный момент.","Не называй трек и не показывай обложку: это ещё прогрев, просто «скоро».","Выкладывай с разницей в день-два в одно и то же время.","Через 48 часов после последнего ролика сравни досмотры, сохранения и комментарии вида «что за трек?».","Победивший кусок бери во все сниппеты недели перед релизом."],tip:"Это единственное исключение из правила «звук только за неделю»: тест показывает, какой кусок цепляет, пока сниппеты ещё не сняты набело."},
vf_teaser:{t:"Как снять тизер",s:["Один образ или деталь: кадр, предмет, цвет, атмосфера.","Длина 5–15 секунд.","Звук: для разогрева приглушённый кусочек или тишина, для намёка на жанр 2–3 секунды характерного звука без припева и слов.","Подпись намёком, название трека не называй.","Если есть пресейв, ссылка лежит в шапке профиля."],tip:"Каждый тизер решает свою задачу: разогреть, намекнуть на жанр или вызвать эмоцию. Трек не показываем."},
vf_cover:{t:"Как сделать: кавер в своём стиле",s:["Выбери узнаваемый трек, который подходит тебе по жанру или настроению.", "Сыграй его по-своему: другой темп, инструмент или подача.", "Хватит куплета или припева, 20–40 секунд.", "В подписи укажи автора оригинала."],tip:"Выкладывать кавер в соцсети можно, а выпускать его на стриминги — только с лицензией на кавер-версию через дистрибьютора."},vf_react:{t:"Как сделать: реакция близких на трек",s:["Позови человека, чьё мнение для тебя важно: друга, маму, брата.", "Дай ему наушники и не объясняй трек заранее.", "Снимай лицо крупно, без постановки.", "Выбери самый честный момент реакции."]},vf_reply:{t:"Как сделать: видео-ответ на комментарий",s:["Найди комментарий с вопросом или интересным мнением.", "В TikTok, Instagram или YouTube Shorts нажми «Ответить» под комментарием и выбери ответ видео.", "Ответь коротко, 15–30 секунд, своими словами.", "Поблагодари автора комментария."]},vf_duet:{t:"Как сделать: дуэт или ремикс с подписчиком",s:["Найди видео слушателя под твой трек или попроси снять своё.", "В TikTok выбери «Дуэт», в Instagram и YouTube Shorts — «Ремикс».", "Подпой, сыграй или просто отреагируй рядом.", "Отметь автора оригинала."]},vf_stems:{t:"Как сделать: разбор трека по дорожкам",s:["Открой проект трека и выключи все дорожки, кроме одной.", "Включай слои по очереди: бит, бас, вокал.", "Последней покажи финальную версию целиком.", "Снимай экран или себя у компьютера."]},vf_carou:{t:"Как сделать: фотодамп",s:["Собери 5–10 фото за время работы над треком.", "Первое фото — самое цепляющее.", "Без фильтров и постановки, живые моменты.", "В подписи 2–3 строки и вопрос подписчикам."]},vf_circle:{t:"Как сделать: кружок в Telegram",s:["Открой свой канал и зажми значок камеры рядом с полем сообщения.", "Говори до минуты, как с другом.", "Расскажи свежую новость о треке или процессе.", "Ответь на реакции под кружком."]},vf_viz:{t:"Как сделать: визуализатор трека на YouTube",s:["Возьми обложку трека в высоком качестве.", "В бесплатном видеоредакторе добавь лёгкую анимацию на всю длину трека.", "Наложи полный трек и выгрузи в 1080p.", "В описании ролика дай ссылки на площадки."]},vf_edits:{t:"Как сделать эдиты",s:["Выбери нишу, которая подходит треку: машины, спорт, игры, природа, город.", "Сними или собери 6–10 своих коротких кадров из этой ниши, по 1–2 секунды.", "Смонтируй так, чтобы смена кадра попадала в бочку и снейр, а на дропе был самый эффектный кадр.", "На дропе крупный текст: «Звук свободен для эдитов — лучшие отмечу».", "Через пару дней найди эдиты под свой звук, отметь лучшие и поблагодари авторов."],tip:"Работает не сразу: эдит-сообщества подхватывают звук, когда он несколько раз попадается им в ленте. Используй только свои кадры или кадры, на которые у тебя есть права."},vf_live:{t:"Как снять живое исполнение",s:["Выбери кусок на 20–40 секунд: припев или самый яркий рифф.","Поставь телефон на штатив поближе к источнику звука, не к колонке.","Сними 2–3 дубля и выбери лучший, без наложения студийной версии.","Добавь субтитры с текстом."]},vf_lip:{t:"Как снять липсинк",s:["Выбери самый цепкий кусок на 10–20 секунд.","Снимай крупно, свет на лицо.","Пой чётко в слова, хук в первые 2 секунды.","Добавь субтитры."]},
vf_dance:{t:"Как снять танец или тренд",s:["Придумай одно действие по 5 признакам: описывается одной фразой, получается с первого дубля, без реквизита, делается одному, понятно без звука.","Проверь на двух знакомых: объясни одной фразой и попроси повторить. Если вышло похоже — действие рабочее.","Возьми короткий кусок, который зацикливается: пауза, сбивка, вход баса. Движение ставь на этот момент.","Сними 2–3 своих ролика в разных местах — это засев. Закрепи лучший в профиле.","Призови повторить и дай один хэштег.","Оцени на 3–4 день: если нет ни одного ролика от незнакомых людей — меняй действие, а не приз."],tip:"Танец из нескольких связок, «покажи свой город» и задания с друзьями обычно не подхватывают."},
vf_lyric:{t:"Как сделать лирик-видео",s:["Публикуй только в TikTok и на неосновном или фан-аккаунте, основной профиль не трогай.","Выбери фон под концепцию: пейзаж, абстракция, город.","Сделай динамичные субтитры строго в такт трека.","Артиста в кадре нет.","Трек поставь звуком."],tip:"Если неосновного аккаунта нет, создай отдельный."},
vf_sms:{t:"Как делать СМС-видео",s:["Заведи неосновной аккаунт в TikTok, основной профиль не трогай. Можно два аккаунта и выкладывать одни и те же фразы в оба.","Сними за один вечер 10–15 коротких планов: дворы, пятиэтажки, фонари, снег, ночная дорога. Людей в кадре можно не показывать.","По центру — одна короткая фраза, которую хочется отправить другу или под которой отметить человека.","Звук — самый взрывной кусок трека. Атмосферный фон не замечают: про трек спрашивают, только когда цепляет сам звук.","Выкладывай серией: 5–7 роликов в неделю. Залетает обычно один из десяти, и залетает фраза, а не картинка.","Фразу, которая выстрелила, повтори на другом фоне и на втором аккаунте.","На «что за трек?» отвечай названием, закрепи комментарий с названием трека и ссылкой на основной профиль.","Примеры фраз: «можешь задать мне три вопроса, врать не буду»; «ладно, так уж и быть, можешь задать мне один вопрос, врать не буду»; «прости, я не буду кидать тебе тиктоки, и вообще нам надо перестать общаться»; «а вот скажи, что тебе нравится и не нравится во мне»; «зачем любоваться звёздами, если у меня есть ты»; «и даже среди тысячи голосов твой будет самым тёплым и любимым»; «если тебя интересует, кого я люблю, то прочитай пятое, шестое и второе слово»; «можно я приду к тебе в гости, ты напоишь меня чаем и мы будем долго-долго обниматься»; «в мире много всего происходит, но ты всё равно важнее»; «вроде бы плавать умею, но в твоей красоте я вечно тону»; «не будешь мне отвечать, отдам тебя бабайке»."],tip:"Суть в самой фразе: проверь, захотелось бы тебе отправить её другу. Мерь успех вопросами «что за трек?» и роликами людей под звук, а не просмотрами."},
vf_snip:{t:"Как снять сниппет",s:["Зачем: чтобы человек услышал кусок трека, он застрял в голове и к релизу трек был знакомым.","Возьми кусок, который выбрал(а) на прослушивании у знакомых: припев, хук, дроп или ключевую строчку, 10–30 секунд. Вступление не бери — в коротком видео нет времени на разгон.","Выбери формат под концепцию: 9:16 или горизонтальный (для VK Клипов только 9:16). Снимай сразу в нужном формате, а не режь потом.","Один герой, одна локация, короткий метр.","Вариации: липсинк, танец под кусок или просто красивый кадр с музыкой."],tip:"Сниппет можно снять отдельно или в общий съёмочный день."},
vf_mood:{t:"Как снять mood-ролик",s:["Зачем: показать настроение, когда сюжет не нужен.","Выбери свет, фактуру и героя в кадре.","Не рассказывай историю, пусть будет состояние.","Из одной смены сделай несколько роликов разной длины под разные площадки."],tip:"Хорошо работает, если трек атмосферный."},
vf_vert:{t:"Как сделать ролик после выхода",s:["Зачем: держать внимание в дни выхода, пока трек набирает прослушивания, и вести людей сразу к треку.","Отличие от сниппета: сниппет — до релиза, задача — чтобы кусок запомнился и сделали пресейв. Ролик после выхода — трек уже можно послушать, поэтому прикрепи его официальным звуком площадки и зови сохранить.","Выложи несколько роликов подряд в дни релиза.","Можно снять отдельно или собрать из материала, который уже есть.","В каждом ролике одна мысль и хук в первые 2 секунды."]},
vf_back:{t:"Как снять бэкстейдж",s:["Зачем: показать процесс и приблизить тебя к людям.","Сними, как готовишься, как идёт съёмка и что происходит между дублями.","Снимай попутно, во время основной съёмки: так бесплатно.","Монтаж простой, человечность важнее лоска."],tip:"Бэкстейдж часто набирает больше, чем сам ролик."},
rel_check:{t:"Проверка релиза на площадках",s:["Открой трек вручную на каждой площадке, где он вышел: Яндекс Музыка, VK Музыка, Apple Music и другие.","Проверь название, исполнителя, обложку, авторов и дату.","Включи трек: он должен играть целиком.","Открой смарт-ссылку и нажми кнопки площадок.","Если что-то не так, сразу пиши в поддержку дистрибьютора."],tip:"Ошибки встречаются чаще, чем кажется, а первые 24–48 часов алгоритмы оценивают трек по поведению слушателей."},
rel_comm:{t:"Комментарии в первые часы",s:["Отвечай на комментарии сразу: платформы смотрят на активность под публикацией.","Если первые комментарии остались без ответа, алгоритм видит слабую вовлечённость.","Репости сторис слушателей, где они публикуют твой трек, и благодари.","Ставь реакции и отвечай хотя бы эмодзи.","Закрепи свой комментарий с вопросом по теме или ссылкой на трек — он задаёт тон обсуждению.","Чтобы не выгореть: 20 минут после публикации и один заход вечером."]},
rel_live:{t:"Прямой эфир в день релиза",s:["Сообщи в сторис, во сколько эфир.","Включи трек целиком и слушай вместе со зрителями, потом отвечай на вопросы из чата.","Расскажи историю написания.","Работает, если у тебя уже есть аудитория."]},
prep:{t:"Как выполнить",s:["Сделай задачу по шагам, которые тебе подходят.","Если задача не нужна, удали её свайпом влево.","Отметь выполненной и коротко напиши, что сделал."]}};
function gid(x){const t=x.title||'';return x.vf?'vf_'+x.vf:/^Проверка трека на хуки/.test(t)?'hookchk':/^Сторис: анимированная обложка/.test(t)?'st_cover':/^Анимированная обложка для сторис/.test(t)?'anim_cover':/^Проверь релиз на каждой/.test(t)?'rel_check':/^Комментарии: отвечай/.test(t)?'rel_comm':/^Прямой эфир/.test(t)?'rel_live':/^Отгрузка дистрибьютору/.test(t)?'upload':/^Выбери кусок для сниппетов/.test(t)?'snippick':/^Видеошот для Яндекс/.test(t)?'videoshot':/^Питчинг: пользовательские/.test(t)?'pitch2':/^Итоги через 7 дней/.test(t)?'d7':/^(Создай пресейв|Пресейв \d\/3)/.test(t)?'ps_one':/пресейв/i.test(t)?'ps_promo':/питчинг/i.test(t)?'pitch':/^Стратегия/.test(t)?'strategy':/^Проверь и поправь/.test(t)?'plan':/^Съёмочный/.test(t)?'shoot':/^Монтаж/.test(t)?'edit':/^Оформление/.test(t)?'design':/^Финальная/.test(t)?'final':/^Релизная ночь/.test(t)?'night':/^Релизный пост на остальных/.test(t)?'others':x.type}
const hKey=x=>x.vf?'vf_'+x.vf:String(x.title||'').replace(/\s*\(видео\)/,'').replace(/\s*\d+\/\d+.*$/,'').replace(/[«(:].*$/,'').trim();
function hShort(p,x){if(p.pro)return true;const k=hKey(x);return p.tasks.filter(t=>t.done&&t.id!==x.id&&hKey(t)===k).length>=2}
function stcH(pl){pl=pl||[];const L=['Цель: в день выхода привести людей слушать прямо из сторис.','Фон: анимированная обложка, которую ты подготовил(а) заранее. Не успел(а) — фото обложки, в редакторе сторис растяни его на весь экран.'];if(pl.includes('ВК'))L.push('ВК: стикер «Музыка» (значок ноты) → найди свой трек → выбери 15 секунд самого цепляющего места, обычно припев. Нажав на стикер, человек слушает трек целиком и добавляет к себе. Трека нет в поиске стикера — открой его в VK Музыке → «Поделиться» → «В историю». Не получилось и так — спроси дистрибьютора, открыл ли он трек для историй и клипов.');if(pl.includes('Instagram'))L.push('Instagram: стикер «Музыка», если трек есть в его библиотеке. Нет — стикер «Ссылка» на смарт-ссылку, звук трека в этом случае не добавляй.');if(pl.includes('Одноклассники'))L.push('Одноклассники: в «Момент» добавь стикер-ссылку на трек.');L.push('Текст на экране: «Новый трек уже вышел» и название. Призыв один: «Нажми на трек и добавь к себе».');if(pl.includes('ВК'))L.push('Через сутки: в статистике истории ВК посмотри, сколько человек нажали на стикер и добавили трек, — пригодится для «Итогов через 7 дней».');return L.join('\n')}
const BKR=/^Бэкстейдж: процесс( \(видео\))? после выхода$/;
function nxRel(p,D,rid){return gAll(p).filter(g=>g.date>D&&g.id!==rid)[0]||null}
function d7T(ng){return ng?'Запиши цифры и выводы и перенеси их на следующий релиз: «'+ng.name+'», '+nice(ng.date):'Запиши цифры и выводы. Следующий релиз ещё не запланирован: добавь его в релизную сетку, идеальный темп — раз в месяц'}
function d7Fix(p,x){if(x.done||!/^Итоги через 7 дней/.test(x.title||'')||!/^Запиши цифры и выводы/.test(x.hint||''))return;const r=p.releases.find(q=>q.id===x.rid);if(r)x.hint=d7T(nxRel(p,r.date,r.id))}
function taskOpen(id){if(tsw){tsw=0;return}const p=P(),x=p.tasks.find(t=>t.id===id);if(!x)return;if(x.sbT&&!x.done){sbGo();return}d7Fix(p,x);if(isPlan(x)&&!x.done){planReview(id);return}const g=GD[gid(x)]||GD.prep,r=p.releases.find(q=>q.id===x.rid);
 const TA={video:'film',story:'film',post:'write',prep:'write',pitch:'write',poll:'think',inter:'think',comm:'listen'};mod=`<div class="mod"><div><div style="display:flex;gap:10px;align-items:center;margin-bottom:6px"><div style="flex:0 0 58px;width:58px">${hero(p,x.done?'happy':'idle',58,1,x.done?'cheer':(TA[x.type]||'think'))}</div><h2 style="margin:0;flex:1;min-width:0">${esc(x.title)}</h2></div><div class="mut" style="margin-bottom:12px">${r?esc(r.name)+' · ':''}${nice(x.date)} · ${esc(fl(x))}${x.acc?' · неосновной аккаунт':''} · +${xpOf(x)} опыта · +${vin(x)} 💿</div>${x.hint?(()=>{const EX=/^(Цель|Зачем|Что такое эдиты|Отличие от сниппета):/,ls=x.hint.split('\n'),sh=hShort(p,x),main=sh?ls.filter(l=>!EX.test(l)):ls,ex=sh?ls.filter(l=>EX.test(l)):[],F=t=>esc(t).replace(/(^|\n)(Цель|Идея|В кадре|Как снять|Фото|Что рассказать|Текст|Формат|Что снять|Что сделать|Звук|Подпись под фото|Текст на сторис|Текст на экране|Что делать|Подпись|Трек|Где ответы|Под жанр|Хук|Потом|Что показать|Вопрос|Фон|Без лица|Карточка|Цифры|Сторис|Зачем|Что такое эдиты|Серия|Отличие от сниппета|Где|Заход|Эксперимент|Что сделать):/g,'$1<b style="color:var(--ink)">$2:</b>').replace(/\n/g,'<br><span style="display:block;height:6px"></span>');return `<p style="line-height:1.5;font-size:15px">${F(main.join('\n'))}</p>${ex.length||(sh&&whyOf(x)&&!x.done)?`<details style="margin:-4px 0 12px"><summary style="cursor:pointer;color:var(--mut);font-size:14px;font-weight:600">Почему и зачем ▾</summary><p style="line-height:1.5;font-size:15px;margin:8px 0 0">${F(ex.join('\n'))}${whyOf(x)&&!x.done?(ex.length?'<br>':'')+'🎯 '+esc(whyOf(x)):''}</p></details>`:''}`})():''}${whyOf(x)&&!x.done&&!hShort(p,x)?`<p style="font-size:15px">🎯 <b>Зачем это:</b> ${esc(whyOf(x))}</p>`:''}${x.miss&&!x.done?`<p style="color:${x.hd?'#ff6b81':'#ff9f43'};font-size:15px">${x.hd?'⛔ Жёсткий дедлайн. ':'⚠️ '}Если пропустить: ${esc(x.miss)}</p>`:''}${psView(x)}${msView(x)}<details class="c" style="margin:0 0 12px;padding:12px 14px"><summary style="cursor:pointer;font-weight:700;color:var(--y)">📋 Пошаговая инструкция${x.pl&&x.pl.length?' по площадкам':''}</summary><div style="margin-top:10px">${pb(x)}<b>${x.pl&&x.pl.length?'Общая инструкция: ':''}${g.t}</b><ol class="gd">${g.s.map(z=>`<li>${z}</li>`).join('')}</ol>${g.tip?`<p class="mut">💡 ${g.tip}</p>`:''}</div></details>${x.done?'':`<button class="btn" onclick="mod='';openDone('${id}')">Выполнено</button>`}<button class="ghost" onclick="mod='';editTask('${id}')">✏️ Изменить</button><button class="ghost" style="color:#ff6b81" onclick="mod='';delTaskAsk('${id}')">🗑 Удалить</button><button class="ghost" onclick="mod='';render()">Закрыть</button></div></div>`;render()}
function taskMenu(id){const x=P().tasks.find(t=>t.id===id);if(!x)return;mod=`<div class="mod"><div><h2 style="margin-top:0">${esc(x.title)}</h2><button class="btn" onclick="mod='';editTask('${id}')">✏️ Изменить</button><button class="ghost" style="color:#ff6b81" onclick="mod='';delTaskAsk('${id}')">🗑 Удалить</button><button class="ghost" onclick="mod='';render()">Отмена</button></div></div>`;render()}
function delTaskAsk(id){mod=`<div class="mod"><div><h2 style="margin-top:0">Удалить задачу?</h2><button class="btn" style="background:#ff6b81;color:#fff" onclick="delTask('${id}')">Удалить</button><button class="ghost" onclick="mod='';render()">Отмена</button></div></div>`;render()}

const WHY=[["Проверка трека на хуки", "Продвижение усиливает трек, но не заменяет его. Деньгами хит не купить: реклама и накрутка дорогие и не дают людей, которые остаются. Цепкий кусок, который хочется пересъёмать, распространяется сам — бесплатно."],["Сторис: анимированная обложка", "Стикер с треком — самый короткий путь от сторис к прослушиванию: одно нажатие, и человек слушает и сохраняет трек, не уходя из ВК."],["Анимированная обложка для сторис", "Движение в кадре останавливает пролистывание. Подготовка заранее экономит утро релиза, когда всё нужно успеть за пару часов."],["Видеошот для Яндекс Музыки", "По данным Яндекс Музыки, треки с видеошотами добавляют в плейлист на 25% чаще. Это 15 секунд из того же съёмочного дня, а работают на каждое прослушивание."],["Выбери кусок для сниппетов", "Артисты часто берут кусок, который нравится им самим, или начало трека. Свежие уши честнее: момент, на котором реагируют они, зацепит и ленту. Один раз выбрал(а) — и все сниппеты, тизер для питчинга и плеер пресейва звучат одним сильным куском."],["Отгрузка дистрибьютору", "Дистрибьютор доставляет трек на все площадки и выдаёт UPC. Без отгрузки нечего ставить в пресейв и некуда подавать на питчинг."],["Создай пресейв", "Пресейв собирает людей заранее: нажавший кнопку получает трек в библиотеку в день выхода, и первый день даёт больше прослушиваний."],["Съёмочный день", "Один день съёмок закрывает почти весь прогрев. Дальше остаётся только выкладывать готовое по плану."],["Питчинг редакторам", "Попадание в редакторский плейлист даёт слушателей вне твоей аудитории. Почти все площадки принимают заявки только до релиза, поэтому подавай заранее."],["Проверь и поправь контент-план", "План собран по шаблону, а твою жизнь знаешь только ты: поездки, работу, выходные. Подстроенный план реально выполнить, а выполненный план даёт стабильный рост."], ["Оформление:", "Человек из поста или поиска смотрит профиль 3–5 секунд. Единые аватар, обложка и шапка показывают, что это живой проект, а ['club',12,'Фан-клуб по подписке 💰 (по желанию)','Цель: дать самым преданным слушателям доступ к закулисью и получать поддержку.\nЧто сделать: выбери площадку для платной подписки (например, платный контент в сообществе ВК или закрытый Telegram-канал). Опиши, что получают подписчики: демки раньше всех, закулисье, ранний доступ к билетам. Условия подключения проверь в настройках площадки.\nПотом: публикуй для подписчиков минимум раз в неделю.\nЗачем: даже 20–30 подписчиков — регулярная поддержка и самое тёплое ядро аудитории.',15,1],

function rbBlock(x){const t=x.title||'';if(['prep','pitch'].includes(x.type))return'';if(['comm','poll','inter'].includes(x.type)||/^(Опрос|Вопрос|Спасибо|Репосты|Интерактив|Угадай|Опиши|Какая строчка|Рассылка|Комментарии|Поделись треком|Прямой эфир)/.test(t))return'fan';if(['back','carou','stems'].includes(x.vf)||/^(Бэкстейдж|Фото из студии|Пост о творческом процессе)/.test(t))return'proc';if(['reply','duet'].includes(x.vf))return'fan';if(['react','cover'].includes(x.vf))return'pers';if(/^(Личный пост|История трека|Вернись к обычным|Рубрика:)/.test(t)&&x.rbb!=='mus')return x.rbb||'pers';return'mus'}

 if(D){const ok=x=>rbBlock(x)==='mus'&&!x.fx&&!x.ess&&(!x.vf||x.vf==='vert')&&!/^(Пресейв|Анонс|Объяви|Релиз|Сниппет|Тест хука|СМС)/.test(x.title)&&['post','story','video'].includes(x.type)&&['warm','post'].includes(x.ph);
  const vs=out.filter(x=>x.vf==='vert').sort((a,b)=>a.date<b.date?-1:1);const keep=vs[0];

  const ex={r:4,w:5,d:6,x:7}[rh]||5;for(let i=0;i<ex;i++){if(share('mus')<=T.mus+.02&&share('proc')>=T.proc*.8&&(cl||share('pers')>=T.pers*.8))break;const b=nxt();if(!b)break;const r=free(b);if(!r)break;const rr=run(),mid=rr.length>2?rr[Math.floor(rr.length/2)]:null;let dt=mid?mid.date:(i%2?add(D,3+i*3):add(D,-9-i*4));if(dt===D)dt=add(D,1);const post=dt>D;out.push({title:'Рубрика: '+r.n,date:dt,type:'post',ph:post?'post':'warm',hint:r.t+(post?'':'. Трек пока не показываем'),fx:false,pl:[],x:false,vf:'',acc:0,rbb:b})}}

function serOrd(ts){const g={};ts.forEach(x=>{if(x.done||x.cu)return;const m=/^(.+?) (\d)\/(\d)(?=:|$)/.exec(x.title||'');if(m){const k=(x.rid||'')+'|'+m[1];(g[k]=g[k]||[]).push([+m[2],x])}});let ch=0;for(const k in g){const a=g[k];if(a.length<2)continue;const ds=a.map(z=>z[1].date).sort();a.sort((p,q)=>p[0]-q[0]).forEach((z,i)=>{if(z[1].date!==ds[i]){z[1].date=ds[i];ch=1}})}const pk=ts.filter(x=>x.title===SPK&&!x.done&&!x.cu);pk.forEach(k=>{const h=ts.filter(x=>x.rid===k.rid&&/^Тест хука 1\/\d$/.test(x.title||'')&&!x.done&&!x.cu)[0];if(h&&k.date>h.date){const z=k.date;k.date=h.date;h.date=z;ch=1}});return ch}

function mig38(){if(!S||!S.p)return;let ch=0;S.p.forEach(p=>(p.tasks||[]).forEach(t=>{if(t.m38)return;t.m38=1;ch=1;if(t.done||t.cu||!/^Рубрика:/.test(t.title||'')||t.rh2!==3)return;const r=(p.releases||[]).find(q=>q.id===t.rid);if(!r||!vd(r.date)||!(t.date<add(r.date,-7)))return;if(/Трек можно поставить тихо фоном|Звук: фрагмент нового трека/.test(t.hint||''))try{rbHint(t,p,r.date)}catch(e){}}));if(ch)save()}
function mig37(){if(!S||!S.p)return;let ch=0;S.p.forEach(p=>{const ts=p.tasks||[],rs={};ts.forEach(t=>{if(t.m37)return;t.m37=1;ch=1;rs[t.rid]=1});for(const r in rs){const L=ts.filter(t=>t.rid===r);serOrd(L);serOrd(L)}});if(ch)save()}
